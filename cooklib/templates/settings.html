<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置 · 晨的书刊库</title><link rel="stylesheet" href="/style.css"><body>{% include "navigation.html" %}<h1>书刊存储设置</h1><p>连接青岛OSS，原PDF仍保留在原来的位置。访问凭据仅保存在本站服务器。</p>{% if configured %}<p>已保存配置。填写下方表单可更新，原凭据不回显。</p>{% endif %}<form method="post" class="settings-form"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Bucket名称<input name="bucket" placeholder="chen-cooking-library" required maxlength="63"></label><label>AccessKey ID<input name="access_id" type="password" autocomplete="off" required maxlength="256"></label><label>AccessKey Secret<input name="access_secret" type="password" autocomplete="new-password" required maxlength="256"></label><p>使用仅允许列出、读取该Bucket的访问凭据即可，无需删除权限。</p><button>保存并查看书刊</button></form>{% if message %}<p role="alert">{{ message }}</p>{% endif %}</body></html>
