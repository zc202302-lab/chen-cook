<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑目录 · {{ book.title }}</title><link rel="stylesheet" href="/style.css"><script src="/manage.js" defer></script><body>{% include "navigation.html" %}<a href="/books/{{ book.id }}">返回书刊</a><h1>编辑目录</h1><p>{{ book.title }} · {{ book.pages }}页</p><p>填写章节名称和实际PDF页码。封面算第1页，可能与纸面印刷页码不同。</p><form method="post" id="contents-form"><input type="hidden" name="csrf" value="{{ csrf }}"><div id="contents-rows">{% for item in entries %}<div class="contents-row"><input name="title" aria-label="章节名称" value="{{ item.title }}" maxlength="500" placeholder="章节名称"><input name="page" aria-label="实际PDF页码" value="{{ item.page }}" type="number" min="1" max="{{ book.pages }}"><button type="button" data-remove-row>移除</button></div>{% else %}<div class="contents-row"><input name="title" aria-label="章节名称" maxlength="500" placeholder="章节名称"><input name="page" aria-label="实际PDF页码" type="number" min="1" max="{{ book.pages }}"><button type="button" data-remove-row>移除</button></div>{% endfor %}</div><button type="button" id="add-row">添加章节</button><label><input type="checkbox" name="clear" value="1">确认清空目录（仅当全部条目为空时）</label><button>保存目录</button></form></body></html>
