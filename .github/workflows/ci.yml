name: Chen Cook CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chen-cook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt playwright PyMuPDF
      - run: python -m compileall -q app.py server.py catalogue.py scripts tests
      - run: node --check web/library/library.js
      - run: bash -n scripts/deploy.sh
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tests/library_browser_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore

